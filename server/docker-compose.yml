services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: projectpulse
      POSTGRES_PASSWORD: projectpulse
      POSTGRES_DB: projectpulse
    ports: ["5432:5432"]
    volumes: ["projectpulse_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  projectpulse_data:
